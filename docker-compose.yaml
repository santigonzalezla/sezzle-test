services:
  backend:
      build:
          context: ./backend
      ports:
          -   "8080:8080"
      environment:
          PORT: 8080
          CORS_ORIGINS: http://localhost:5173, http://localhost:8081

  frontend:
      build:
          context: ./frontend
          args:
              VITE_API_BASE_URL: http://localhost:8080
      ports:
          -   "8081:80"
      depends_on:
          -   backend
